openapi: 3.1.0
info:
  title: BARPO AI API
  version: 0.2.0
  description: UZS decimal qiymatlar string. Tenant sessiyadan olinadi. Sessiya Bearer token yoki httpOnly cookie orqali.
    Trial tugashi avtomatik bloklamaydi; platforma egasi qo‘lda hal qiladi.
servers:
  - url: http://localhost:3001
paths:
  /v1/auth/login:
    post:
      summary: Login yoki telefon raqami bilan kirish; cookie va Bearer sessiya; bloklangan admin faqat billing/supportga kira
        oladi
      operationId: post_v1_auth_login
      security: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a1
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a1
        "402": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "410": *a1
        "429": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                login:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - login
                - password
              additionalProperties: false
  /v1/auth/invites/preview:
