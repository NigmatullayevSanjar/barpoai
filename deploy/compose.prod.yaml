# BARPO AI production: bitta VPS (Hetzner 2 vCPU / 4 GB). Ishga tushirish: docs/DEPLOY_HETZNER.md
# Tashqariga faqat Caddy (80, 443) ochiq; baza va API faqat ichki tarmoqda.
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: barpo_owner
      POSTGRES_DB: barpo
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
    # 4 GB RAM uchun: baza ~1 GB dan oshmaydi, qolgani API importlariga.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/docker/init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barpo_owner -d barpo"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ../backend
    image: barpo-backend
    command: ["node", "dist/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://barpo_owner:${DB_OWNER_PASSWORD}@db:5432/barpo
    depends_on:
      db: {condition: service_healthy}
  api:
    image: barpo-backend
    environment:
      DATABASE_URL: postgresql://barpo_app:${DB_APP_PASSWORD}@db:5432/barpo
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      TRUST_PROXY: 1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-barpoai_bot}
      TELEGRAM_LINK_TOKEN_TTL_SECONDS: ${TELEGRAM_LINK_TOKEN_TTL_SECONDS:-300}
    volumes: ["private_files:/app/storage"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    image: barpo-backend
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://barpo_app:${DB_APP_PASSWORD}@db:5432/barpo
      APP_ORIGIN: https://${DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-barpoai_bot}
      TELEGRAM_LINK_TOKEN_TTL_SECONDS: ${TELEGRAM_LINK_TOKEN_TTL_SECONDS:-300}
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  private_files:
  caddy_data:
  caddy_config:
