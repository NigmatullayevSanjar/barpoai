        "404": *a13
        "409": *a13
        "410": *a13
        "429": *a13
        "503": *a13
  /v1/auth/telegram/login:
    post:
      summary: Oldindan ulangan Telegram (Login Widget imzosi) bilan kirish
      operationId: post_v1_auth_telegram_login
      security: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a14
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a14
        "402": *a14
        "403": *a14
        "404": *a14
        "409": *a14
        "410": *a14
        "429": *a14
        "503": *a14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                id:
                  type: string
                  pattern: ^\d+$
                auth_date:
                  type: string
                  pattern: ^\d+$
                hash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                first_name:
                  type: string
                  maxLength: 100
                last_name:
                  type: string
                  maxLength: 100
                username:
                  type: string
                  maxLength: 100
                photo_url:
                  type: string
                  maxLength: 1000
              required:
                - id
                - auth_date
                - hash
              additionalProperties: false
  /v1/me/notifications:
    get:
      summary: O‘z bildirishnomalari; unread soni bilan
      operationId: get_v1_me_notifications
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            default: 30
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: true
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 100000
        - name: unread
          in: query
          required: false
          schema:
            type: boolean
      x-permission: authenticated
      x-tenant-scope: true
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a15
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
