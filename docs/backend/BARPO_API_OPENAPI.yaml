openapi: 3.1.0
info:
  title: BARPO AI API
  version: 0.2.0
  description: UZS decimal qiymatlar string. Tenant sessiyadan olinadi. Sessiya Bearer token yoki httpOnly cookie orqali.
    Trial yoki to‘langan davr tugab, to‘lov qilinmasa kompaniya avtomatik bloklanadi; to‘lov qoplasa blok ochiladi
    (D33).
servers:
  - url: http://localhost:3001
paths:
  /v1/auth/login:
    post:
      summary: Login yoki telefon raqami bilan kirish; cookie va Bearer sessiya; bloklangan admin faqat billing/supportga kira
        oladi
      operationId: post_v1_auth_login
      security: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a1
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a1
        "402": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "410": *a1
        "429": *a1
        "503": *a1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                login:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - login
                - password
              additionalProperties: false
  /v1/auth/login/verify:
    post:
      summary: "Ikki bosqichli kirish: Telegram botga kelgan 6 xonali kod bilan sessiya olish (challenge 5 daqiqa, 5 urinish)"
      operationId: post_v1_auth_login_verify
      security: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a2
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a2
        "402": *a2
        "403": *a2
        "404": *a2
        "409": *a2
        "410": *a2
        "429": *a2
        "503": *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                challenge:
                  type: string
                  minLength: 32
                  maxLength: 100
                code:
                  type: string
                  pattern: ^\d{6}$
              required:
                - challenge
                - code
              additionalProperties: false
  /v1/auth/invites/preview:
    post:
      summary: Linkni sarflamasdan tekshirish
      operationId: post_v1_auth_invites_preview
      security: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
