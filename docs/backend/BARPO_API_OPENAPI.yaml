        "400": &a12
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a12
        "402": *a12
        "403": *a12
        "404": *a12
        "409": *a12
        "410": *a12
        "429": *a12
