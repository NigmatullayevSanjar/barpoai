      summary: Individual link orqali bir martalik admin signup
      operationId: post_v1_auth_register
      security: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a4
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a4
        "402": *a4
        "403": *a4
        "404": *a4
        "409": *a4
        "410": *a4
        "429": *a4
        "503": *a4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                token:
                  type: string
                  minLength: 32
                  maxLength: 100
                login:
                  type: string
                  pattern: ^[a-zA-Z0-9._-]{3,64}$
                password:
                  type: string
                  minLength: 6
                  maxLength: 128
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 500
                phone: {}
              required:
                - token
                - login
                - password
                - display_name
              additionalProperties: false
  /v1/exchange-rates/latest:
    get:
      summary: "So‘nggi USD kursi (CBU): rate, rate_date, source; kurs yo‘q bo‘lsa rate=null. Faqat ko‘rsatish uchun, saqlash
