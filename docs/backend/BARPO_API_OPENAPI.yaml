          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                new_password:
                  type: string
                  minLength: 6
                  maxLength: 128
              required:
                - current_password
                - new_password
              additionalProperties: false
  /v1/auth/profile:
    patch:
      summary: "O‘z profilini tahrirlash: ism va telefon"
      operationId: patch_v1_auth_profile
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: true
      responses:
        "200":
