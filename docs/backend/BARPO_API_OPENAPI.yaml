        "401": *a15
        "402": *a15
        "403": *a15
        "404": *a15
        "409": *a15
        "410": *a15
        "429": *a15
        "503": *a15
  /v1/me/notifications/read:
    post:
      summary: Bildirishnomalarni o‘qilgan deb belgilash (ids bo‘sh bo‘lsa hammasi)
      operationId: post_v1_me_notifications_read
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters: []
      x-permission: authenticated
      x-tenant-scope: true
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a16
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a16
        "402": *a16
        "403": *a16
        "404": *a16
        "409": *a16
        "410": *a16
        "429": *a16
        "503": *a16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                ids:
                  default: []
                  maxItems: 200
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - ids
              additionalProperties: false
  /v1/platform/subscriptions:
    post:
      summary: Korxonaga tarif versiyasi biriktirish; davr boshlanishi berilmasa trial tugashi yoki oxirgi qoplangan sana
      operationId: post_v1_platform_subscriptions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters: []
      x-permission: platform_owner|super_admin|support + plans.manage
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a17
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a17
        "402": *a17
        "403": *a17
        "404": *a17
        "409": *a17
        "410": *a17
        "429": *a17
        "503": *a17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $schema: https://json-schema.org/draft/2020-12/schema
              type: object
              properties:
                tenant_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                plan_version_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                next_period_start:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              required:
                - tenant_id
                - plan_version_id
              additionalProperties: false
  /v1/platform/tenants:
    get:
      summary: Korxonalar, egaga tegishli alias va trial/to‘lov holati (muddati tugab to‘lanmagani worker bilan bloklanadi,
        D33); q — nom, kalit, alias; state — access_state filtri
      operationId: get_v1_platform_tenants
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            default: 30
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: true
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 100000
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - trial
              - paid
              - overdue
              - blocked
              - archived
        - name: plan
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 500
      x-permission: platform_owner|super_admin|support
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a18
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a18
        "402": *a18
        "403": *a18
        "404": *a18
        "409": *a18
        "410": *a18
        "429": *a18
        "503": *a18
    post:
      summary: "Yangi korxona yaratish (Figma F6 uch qadam: profil, alias, boshlang‘ich tarif — bitta so‘rovda); trial
        signupda boshlanadi"
      operationId: post_v1_platform_tenants
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters: []
      x-permission: platform_owner|super_admin|support + tenants.manage
      x-tenant-scope: false
      responses:
        "200":
          description: Muvaffaqiyat
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a19
          description: Xato; error.code mashina uchun barqaror identifikator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": *a19
        "402": *a19
        "403": *a19
        "404": *a19
        "409": *a19
        "410": *a19
        "429": *a19
