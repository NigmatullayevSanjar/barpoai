  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f8fafc;
      color: #681b33;
      font-family: Geist, Arial, sans-serif;
    }

    .error-viewport {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    .error-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1440px;
      height: 1000px;
      transform: translate(-50%, -50%) scale(var(--page-scale, 1));
      transform-origin: center;
    }

    .message,
    .error-label,
    .digit {
      position: absolute;
      margin: 0;
      font-weight: 600;
      line-height: normal;
      white-space: nowrap;
    }

    .message {
      top: 617.5px;
      left: 392px;
      font-size: 30px;
      transform: translateY(-50%);
    }

    .error-label {
      top: 483px;
      left: 389px;
      font-size: 300px;
      transform: translateY(-50%);
    }

    .digit {
      left: 858px;
      font-size: 300px;
      transform: translateY(-50%);
    }

    .digit-top {
      top: 297px;
    }

    .digit-bottom {
      top: 726px;
    }

    .construction {
      position: absolute;
      top: 314px;
      left: 739px;
      width: 90px;
      height: 90px;
    }

    .construction img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transform: rotate(180deg) scaleY(-1);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

  <script>
    (() => {
      const viewport = document.querySelector('.error-viewport');

      function fitPage() {
        const scale = Math.min(
          viewport.clientWidth / 1440,
          viewport.clientHeight / 1000,
          1
        );

        document.documentElement.style.setProperty('--page-scale', scale);
      }

      fitPage();
      window.addEventListener('resize', fitPage, { passive: true });
    })();
